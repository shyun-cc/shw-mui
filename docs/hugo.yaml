title: shw-mui 设计讨论稿
baseURL: https://shyun-cc.github.io/shw-mui/
defaultContentLanguage: zh
hasCJKLanguage: true
enableRobotsTXT: true
timeZone: UTC
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    title: shw-mui 设计讨论稿
    params:
      description: 文档先行的设计讨论稿；产品方案尚未确认或实现。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML, RSS]
params:
  offline_search: true
  copyright:
    authors: shw-mui contributors
    from_year: 2026
  ui:
    preset: paper
    dark_mode: true
    sidebar_menu_foldable: true
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
